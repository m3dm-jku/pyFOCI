name: Unit Tests

on:
  push:
    branches:
    - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        environment: [latest]
        include:
          - os: ubuntu-latest
            environment: oldest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Run the FOCI R package cross-check once to get full code coverage.
      - name: Set up R (Ubuntu latest)
        if: matrix.os == 'ubuntu-latest' && matrix.environment == 'latest'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install FOCI R package (Ubuntu latest)
        if: matrix.os == 'ubuntu-latest' && matrix.environment == 'latest'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: "any::FOCI"

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.68.1
          environments: ${{ matrix.environment }}
          frozen: true

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.environment == 'latest'
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: m3dm-jku/pyFOCI
          fail_ci_if_error: true
